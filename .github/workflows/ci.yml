name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [vehicle-config-service, showroom-orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: mvn -B test

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: E2E package typecheck
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck

  e2e:
    name: Outside-in e2e (Podman)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Install Playwright with system dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the full outside-in e2e
        env:
          WEB_PORT: '18080'
        run: ./scripts/e2e.sh
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
